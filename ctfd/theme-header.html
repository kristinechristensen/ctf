<style>
/* Flags to Futures home page: scoped to .zth-home to avoid altering CTFd admin screens */
.zth-home{--zth-navy:#0B1429;--zth-panel:#152340;--zth-purple:#AC90FF;--zth-cyan:#5CE0DB;--zth-gold:#F6C969;--zth-white:#f8fafc;--zth-muted:#cbd5e1;color:var(--zth-white);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:1160px;margin:1.5rem auto 3rem;line-height:1.55}
.zth-home *{box-sizing:border-box}.zth-home .zth-hero{position:relative;overflow:hidden;border:1px solid #465181;border-radius:22px;padding:3.5rem 2rem;text-align:center;background:radial-gradient(circle at 90% 0%,#503387 0%,transparent 42%),radial-gradient(circle at 5% 100%,#164e63 0%,transparent 38%),#0B1429;box-shadow:0 18px 45px #0f172a22}
.zth-home .zth-kicker{font-weight:750;font-size:.83rem;letter-spacing:.18em;color:var(--zth-gold)}.zth-home .zth-mascot{font-size:3.6rem;margin:.6rem 0}.zth-home h1{color:var(--zth-white);font-weight:900;letter-spacing:-.035em;font-size:clamp(2.1rem,5.6vw,4.8rem);line-height:1.08;margin:.3rem 0}.zth-home h1 span{color:var(--zth-gold)}.zth-home h1 em{color:var(--zth-cyan);font-style:normal}.zth-home .zth-tagline{font-size:clamp(1.1rem,2.3vw,1.5rem);font-weight:750;color:var(--zth-white);margin:1rem 0}.zth-home .zth-intro{max-width:700px;margin:0 auto 1.75rem;color:var(--zth-muted);font-size:1.05rem}
.zth-home .zth-actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}.zth-home a.zth-btn{display:inline-block;border-radius:11px;padding:.8rem 1.2rem;text-decoration:none;font-weight:750;transition:transform .15s ease,background-color .15s ease}.zth-home a.zth-btn:hover{transform:translateY(-2px);text-decoration:none}.zth-home a.zth-btn:focus-visible,.zth-home .zth-footer a:focus-visible{outline:3px solid var(--zth-gold);outline-offset:3px}.zth-home .zth-btn-primary{background:#7c3aed;color:#fff}.zth-home a.zth-btn-primary:hover{background:#6d28d9;color:#fff}.zth-home .zth-btn-secondary{background:#22304e;color:#fff;border:1px solid #8b9bc7}.zth-home a.zth-btn-secondary:hover{background:#334467;color:#fff}
.zth-home .zth-section{padding:2.4rem 0 .2rem}.zth-home .zth-section h2{font-weight:850;font-size:1.65rem;margin:0 0 1.2rem;color:#1e293b}.zth-home .zth-steps,.zth-home .zth-categories{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}.zth-home .zth-steps article,.zth-home .zth-categories article{background:var(--zth-navy);padding:1.35rem;border-radius:14px;border:1px solid #465181}.zth-home .zth-number{display:inline-flex;justify-content:center;align-items:center;border-radius:100px;width:2.7rem;height:2.7rem;font-weight:900;background:#50348b;color:#fff}.zth-home h3{color:var(--zth-white);font-size:1.04rem;font-weight:800;margin:.75rem 0 .4rem}.zth-home article p{color:var(--zth-muted);font-size:.92rem;margin:0}.zth-home .zth-categories article>span{font-size:2rem}.zth-home .zth-categories strong{display:block;color:var(--zth-cyan);margin-top:1rem;font-size:.85rem}.zth-home code{background:#334155;color:#fff;padding:.1rem .3rem;border-radius:5px}.zth-home .zth-bottom{margin-top:2.4rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.75rem;border-radius:16px;background:var(--zth-navy);border:1px solid #465181}.zth-home .zth-bottom h2{font-size:1.35rem;color:var(--zth-gold);margin:0 0 .4rem}.zth-home .zth-bottom p{color:var(--zth-muted);margin:0;max-width:640px}.zth-home .zth-bottom .zth-btn{flex-shrink:0}.zth-home .zth-footer{text-align:center;color:#475569;font-size:.85rem;margin:2rem 0}.zth-home .zth-footer a{color:#155e75;text-decoration:underline}
@media(max-width:850px){.zth-home .zth-steps,.zth-home .zth-categories{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:550px){.zth-home .zth-hero{padding:2.4rem 1rem}.zth-home .zth-steps,.zth-home .zth-categories{grid-template-columns:1fr}.zth-home .zth-bottom{flex-direction:column;align-items:stretch}.zth-home .zth-actions .zth-btn{width:100%}}
@media(prefers-reduced-motion:reduce){.zth-home a.zth-btn{transition:none}.zth-home a.zth-btn:hover{transform:none}}
</style>
